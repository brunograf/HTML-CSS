<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Desafio do Boletim</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            caption-side: top;
            font-weight: bold;
            background-color: lightgray;
        }

        thead th{
            border: 1px solid #000;
            text-align: center;
            padding: 8px;
            background-color: gray;
            color: white;
        }

        th{
            border: 1px solid #000;
            text-align: center;
            padding: 8px;
        }

        td {
            border: 1px solid #000;
            padding: 8px;
            text-align: center;
        }

        td.disciplina {
            text-align: left;
        }

        .media{
            color: white;
            background-color: gray;
            font-weight: bold;
        }
        
        th.media{
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Desafio do Boletim</h1>
        <hr>
        <table>
            <caption>Boletim escolar</caption>
            <thead>
                <tr>
                    <th rowspan="2" scope="col">Área</th>
                    <th rowspan="2" scope="col">Disciplinas</th>
                    <th colspan="2" scope="colgroup">Notas</th>
                    <th rowspan="2" scope="col">Média</th>
                </tr>
                <tr>
                    <th scope="col">Nota 1</th>
                    <th scope="col">Nota 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th rowspan="4" scope="rowgroup">Exatas</th>
                    <td class="disciplina">Matemática</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td class="disciplina">Física</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td class="disciplina">Química</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td class="disciplina">Biologia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <th colspan="4" scope="row" class="media">Média de Exatas</th>
                    <td class="media">0.0</td>
                </tr>
                <tr>
                    <th rowspan="2" scope="rowgroup">Humanas</th>
                    <td class="disciplina">História</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td class="disciplina">Geografia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <th colspan="4" scope="row" class="media">Média de Humanas</th>
                    <td class="media">0.0</td>
                </tr>
            </tbody>
        </table>
</body>
</html>

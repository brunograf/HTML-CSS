<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
        <hr>
        <form action="cadastro.php" method="post" autocomplete="on">
            <p>
                <label for="iusuario">Usuário:</label>
                <input type="text" name="usuario" id="iusuario" required minlength="5" maxlength="30" size="10" placeholder="Usuário" autocomplete="username">
            </p>
            <p>
                <label for="isenha">Senha:</label>
                <input type="password" name="senha" id="isenha" placeholder="Senha" required minlength="8" maxlength="13" autocomplete="current-password">
            </p>
            <p><input type="submit" value="Enviar"><input type="reset" value="Limpar"></p>
        </form>
</body>
</html>

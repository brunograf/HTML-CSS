<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=[device-width], initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
        <hr>
        <form action="cadastro.php" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <p>
                    <label for="inome">Nome:</label>
                    <input type="text" name="nome" id="inome" required maxlength="50" placeholder="Nome Completo" autocomplete="name">
                </p>
                <p>
                    <label for="iemail">E-mail:</label>
                    <input type="email" name="email" id="iemail" required maxlength="50" placeholder="seunome@gmail.com" autocomplete="email">
                </p>
                <p>
                    <label for="itelefone">Telefone:</label>
                    <input type="tel" name="telefone" id="itelefone" required maxlength="15" pattern="^\([0-9]{2}\)[0-9]{4,5}-[0-9]{4}$" placeholder="(XX) XXXXX-XXXX" autocomplete="tel">
                </p>
            </fieldset>
            <p><input type="submit" value="Enviar"> <input type="reset" value="Limpar"></p>
        </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <title>Flexbox</title>
    <style>
        div.conteiner{
            display: flex;
            flex-flow: row nowrap;

            background-color: lightsalmon;
        }

        div.item{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;

            flex-basis: 200px;
        }

        #item1{
            flex-grow: 0;
            flex-shrink: 1;
        }

        #item2{
            flex-grow: 2;
            flex-shrink: 1;
        }

        #item3{
            flex-grow: 4;
            flex-shrink: 1;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="item1">Exemplo de Bloco A</div>
        <div class="item" id="item2">Exemplo de Bloco B</div>
        <div class="item" id="item3">Exemplo de Bloco C</div>
    </div>
</body>
</html

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>iFrames</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>iFrames</h1>
        <hr>
        <p>
            Acessando o site do 
            <iframe height="500px" src="https://www.cursoemvideo.com" frameborder="0" scrolling="no">
                <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
            </iframe>
            para aprender a programar!
        </p>
        <p>
            O repositório 
            <iframe height="500px" width="500px" src="https://gustavoguanabara.github.io" frameborder="0">
                <a href="https://gustavoguanabara.github.io">do Guanabara</a>
            </iframe>
            é bem legal!
        </p>
</body>
</html>
